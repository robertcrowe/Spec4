[project]
name = "spec4"
version = "1.0.0"
description = "AI-assisted software project planning — from idea to executable coding phases"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Robert Crowe", email = "please-post-in-github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.11",
    "dash>=2.17.0,<5",
    "dash-iconify>=0.1.2,<1",
    "dash-mantine-components>=0.14.0,<3",
    "gunicorn>=21.2,<26",
    "httpx>=0.27,<1",
    "jsonschema>=4.26.0",
    "litellm>=1.82.0,<2",
    "mcp>=1.26.0,<2",
    "pyyaml>=6.0.3",
]

[project.scripts]
spec4 = "spec4.app:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "playwright>=1.60.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Long system-prompt strings in multi-line literals cannot use inline noqa
"src/spec4/agents/*.py" = ["E501"]
"src/spec4/agentifier/*.py" = ["E501"]
"tests/agentifier/*.py" = ["E501"]
"tests/integration/*.py" = ["E501"]
"evals/*.py" = ["E501"]
# Clientside-callback JavaScript strings contain long single lines; imports
# are intentionally placed after the litellm log-level/env setup that must run
# before litellm is first imported by any downstream module.
"src/spec4/app.py" = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "dash",
    "dash.*",
    "dash_mantine_components",
    "dash_mantine_components.*",
    "dash_iconify",
    "dash_iconify.*",
    "litellm",
    "litellm.*",
    "a2a_sdk",
    "a2a_sdk.*",
    "mcp",
    "mcp.*",
    "gunicorn",
    "gunicorn.*",
    "jsonschema",
    "jsonschema.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true
