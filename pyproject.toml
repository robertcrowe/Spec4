[project]
name = "spec4"
version = "1.5.0"
description = "AI-assisted software project planning — from idea to executable coding phases"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Robert Crowe", email = "please-post-in-github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.11",
    "dash>=2.17.0,<5",
    "dash-mantine-components>=0.14.0,<3",
    "gunicorn>=21.2,<26",
    "httpx>=0.27,<1",
    "jsonschema>=4.26.0",
    "litellm>=1.82.0,<2",
    "mcp>=1.26.0,<2",
    "pyyaml>=6.0.3",
]

[project.scripts]
spec4 = "spec4.app:main"
spec4-usage = "spec4.usage_report:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "playwright>=1.60.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Promoted at cleanup Phase 5p, after every finding under them was decomposed or
# carried a justified noqa. PLR is promoted by the three rules Phase 5 actually
# measured and cleared -- PLR0912/0913/0915 -- not wholesale: bare "PLR" also
# carries PLR2004 (49 in src/), PLR0911 (7) and PLR1714 (1), which Phase 0 never
# counted and Phase 5 never touched. See CLEANUP_INVENTORY.md 42.6 and 49.4.
# PLR2004 promoted at cleanup Phase 7p on the same pattern, clear then promote:
# its 49 in src/ became nine named constants and 39 reasoned noqas (78.2, 78.4).
select = ["E", "F", "C90", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "SIM", "B", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Long system-prompt strings in multi-line literals cannot use inline noqa
"src/spec4/agents/**/*.py" = ["E501"]
"src/spec4/agentifier/**/*.py" = ["E501"]
"tests/agentifier/*.py" = ["E501"]
"tests/integration/*.py" = ["E501"]
"evals/*.py" = ["E501"]
# Test-shaped code. ARG: fixture, stub and lambda parameters a test must accept
# but need not read. SIM117: `pytest.raises` + `patch` stacks whose nesting is
# deliberate and reads better than a merged `with`. PLR0913: fixture-heavy
# signatures. Fixing these would be churn with no reader benefit; the mechanical
# ones (SIM300, B905, SIM105) were fixed rather than ignored.
# PLR2004 is deferred in the next three entries, not exempted. When it was promoted
# (cleanup Phase 7p, CLEANUP_INVENTORY.md 78.4) it had 230 findings in tests/,
# 25 in evals/ and 6 in scripts/. Those counts are the size of the later work.
"tests/**/*.py" = ["ARG", "SIM117", "PLR0913", "PLR2004"]
# evals/ and scripts/ are outside the Rule 6 gate (`ruff check src/ tests/`) and
# were never measured by Phase 5; the same test-shaped exemptions apply, plus the
# long-function rules a one-shot script legitimately trips.
"evals/**/*.py" = ["ARG", "SIM", "PLR0913", "PLR0915", "C90", "PLR0912", "B905", "PLR2004"]
"scripts/**/*.py" = ["ARG", "SIM", "PLR0913", "PLR0915", "C90", "PLR0912", "B905", "PLR2004"]
# Clientside-callback JavaScript strings contain long single lines; imports
# are intentionally placed after the litellm log-level/env setup that must run
# before litellm is first imported by any downstream module.
"src/spec4/app.py" = ["E501", "E402"]

[tool.pytest.ini_options]
# Added at cleanup Phase 6. Without it pytest collects from the repo root, so a
# bare `uv run pytest` pulled in four modules under evals/ -- 82 of 4,257 tests.
# evals/ is outside the Rule 6 gate for linting and is now outside collection
# too. See CLEANUP_INVENTORY.md 50.0(e) and 50.5(b).
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "dash",
    "dash.*",
    "dash_mantine_components",
    "dash_mantine_components.*",
    "litellm",
    "litellm.*",
    "a2a_sdk",
    "a2a_sdk.*",
    "mcp",
    "mcp.*",
    "gunicorn",
    "gunicorn.*",
    "jsonschema",
    "jsonschema.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true

[tool.deptry.per_rule_ignores]
# gunicorn is used only as a process (Makefile `serve` target), not imported.
# pyyaml is imported as `yaml`; deptry's module-name mapping misses it when
# the package is not installed in the isolated environment deptry runs from.
DEP002 = ["gunicorn", "pyyaml"]
